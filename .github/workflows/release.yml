name: Windows installer
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: Stable version (for example 0.7.0)
        required: true
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-release.txt -r requirements-build.txt
      - name: Audit explicit publication files
        run: python tools/privacy_check.py
      - name: Ensure Inno Setup
        shell: pwsh
        run: |
          if (!(Test-Path 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe')) { choco install innosetup --yes --no-progress }
      - name: Regression tests
        run: python -m unittest discover -s tests -q
      - name: Build installer
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          $version = if ($env:INPUT_VERSION) { $env:INPUT_VERSION } else { $env:GITHUB_REF_NAME.TrimStart('v') }
          python tools/build_release.py --version $version --repository $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV
      # No artifact upload or release creation: both require explicit human review.
